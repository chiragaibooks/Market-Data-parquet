name: Run Technical Indicators Script

on:
  workflow_dispatch:
  schedule:
    - cron: '45-59 3 * * 1-5'   # 09:15-09:29 IST (03:45-03:59 UTC)
    - cron: '* 4-9 * * 1-5'     # 09:30-15:29 IST (04:00-09:59 UTC)
    - cron: '0 10 * * 1-5'      # 15:30 IST (10:00 UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data, save parquet & update README
        run: python main.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          else
            echo "No changes to commit"
          fi
