name: Run Technical Indicators Script

on:
  workflow_dispatch:
  schedule:
    # Every 1 min, 03:00-10:59 UTC == 08:30-16:29 IST, Mon-Fri.
    # Covers market hours 09:15-15:30 IST; main.py filters candles to that window.

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data, save parquet & update README
        run: python main.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          else
            echo "No changes to commit"
          fi
