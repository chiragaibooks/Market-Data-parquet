name: Run Technical Indicators Script

on:
  workflow_dispatch:
  schedule:
    - cron: '* 3-10 * * 1-5'    # every 1 min, 08:30-16:00 UTC (09:15-15:30 IST)
    - cron: '5 10 * * 1-5'      # 15:35 IST — after market close, backfill parquet

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data, save parquet & update README
        run: python main.py

      - name: Backfill missing parquet files
        run: python generate_parquet.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          else
            echo "No changes to commit"
          fi
